<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fajos Piteados Central{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/logo.png" type="image/png">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/static/logo.png" alt="Logo Fajos Piteados Central">
      <span>Fajos Piteados Central</span>
    </a>
    <nav class="nav">
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/trabajadores" class="{% if '/trabajadores' in request.url.path %}active{% endif %}">Trabajadores</a>
      <a href="/produccion" class="{% if '/produccion' in request.url.path %}active{% endif %}">Producción</a>
      <a href="/docs" target="_blank" rel="noopener">API</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Fajos Piteados Central · Nóminas · Red local
    {% if request.url.scheme == 'https' %}· <span title="Conexión cifrada">HTTPS</span>{% endif %}
  </footer>
</body>
</html>
